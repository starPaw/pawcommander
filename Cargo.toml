[package]
name = "pawcommander"
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
description = "A dual-pane desktop file manager with SFTP and Catppuccin themes"
repository = "https://github.com/starPaw/pawcommander"
readme = "README.md"
license = "MIT"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland", "accesskit", "clipboard", "links"] }
egui_extras = { version = "=0.37.0", features = ["image"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
icu_normalizer = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
chrono = "=0.4.45"
dirs = "=7.0.0"
open = "=5.4.5"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
trash = "=5.3.0"
ssh2 = { version = "=0.9.7", features = ["vendored-openssl"] }
url = "=2.5.8"
percent-encoding = "=2.3.2"
regex = "=1.13.1"
pulldown-cmark = { version = "=0.13.6", default-features = false }
html5ever = "=0.40.1"
tempfile = "=3.27.0"
rawzip = "=0.5.2"
zip = { version = "=9.7.0", default-features = false, features = ["aes-crypto", "deflate-flate2"] }
flate2 = "=1.1.11"
tar = { version = "=0.4.46", default-features = false }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
zeroize = "=1.9.1"
keyring = { package = "keyring-core", version = "=1.0.1" }
raw-window-handle = "=0.6.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", features = ["NSArray", "NSGeometry", "NSObject", "NSString", "NSThread", "NSURL"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSApplication", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSGraphicsContext", "NSImage", "NSMenu", "NSMenuItem", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSView", "NSWindow", "NSWorkspace"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "=1.1.0"
clipboard-win = { version = "=5.4.3", features = ["std"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "=0.62.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["crypto-rust"] }
clipboard-rs = { version = "=0.3.5", default-features = false }
wl-clipboard-rs = "=0.9.5"
wayland-client = { version = "=0.31.15", features = ["system", "dlopen"] }
x11rb = "=0.13.2"
x11-dl = "=2.21.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
rustix = { version = "=1.1.6", features = ["fs"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true

[build-dependencies]
cc = "=1.11.1"
