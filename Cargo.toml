[package]
name = "pawcommander"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "A dual-pane desktop file manager with SFTP and Catppuccin themes"
repository = "https://github.com/starPaw/pawcommander"
readme = "README.md"
license = "MIT"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland", "accesskit"] }
egui_extras = { version = "=0.31.1", features = ["image"] }
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
chrono = "0.4"
dirs = "6"
open = "5"
serde = { version = "1", features = ["derive"] }
trash = "5.2"
ssh2 = { version = "0.9.7", features = ["vendored-openssl"] }
url = "2"
percent-encoding = "2"
tempfile = "3"
serde_json = "1"
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "=0.6.2"
objc2 = "=0.5.2"
objc2-foundation = { version = "=0.2.2", features = ["NSArray", "NSGeometry", "NSObject", "NSString", "NSThread", "NSURL"] }
objc2-app-kit = { version = "=0.2.2", default-features = false, features = ["std", "NSApplication", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSGraphicsContext", "NSImage", "NSMenu", "NSMenuItem", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSView", "NSWindow", "NSWorkspace"] }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = { version = "=5.4.3", features = ["std"] }
raw-window-handle = "=0.6.2"

[target.'cfg(target_os = "linux")'.dependencies]
clipboard-rs = { version = "=0.3.2", default-features = false }
wl-clipboard-rs = "=0.9.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 2
lto = "thin"
strip = true

