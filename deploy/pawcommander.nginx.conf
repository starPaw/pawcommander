server {
    listen 80;
    listen [::]:80;
    server_name pawcommander.capture402.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/pawcommander/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://pawcommander.capture402.xyz$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pawcommander.capture402.xyz;

    root /var/www/pawcommander/current;
    index index.html;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/pawcommander.capture402.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pawcommander.capture402.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;
    gzip_min_length 512;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
