name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        env:
          VERSION: 8.30.1
        run: |
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl --fail --silent --show-error --location "$base/$archive" -o "$RUNNER_TEMP/$archive"
          curl --fail --silent --show-error --location "$base/gitleaks_${VERSION}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          cd "$RUNNER_TEMP"
          grep "  $archive$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - name: Scan history
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --redact'
